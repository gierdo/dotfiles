name: bug-fix
version: 4
description: >-
  Drive a bug from report to a verified fix, root-cause first, with OpenSpec as
  the system of record for the fix plan and tasks. The `debug` sub-workflow
  (triage, reproduce, diagnose) proves the cause; this workflow then plans the
  fix in an OpenSpec change, implements it, verifies it, and integrates it.
  Loops: a fix or plan that does not hold re-enters `debug` at the right state;
  a bad plan goes to plan_revision.

# OpenSpec conventions (skills, changeRoot, gates, resume) are in the executor
# skill. `{task}` is also the change name. `bugs/{task}/diagnosis.md` is the
# debug child's output: read it here, never edit it; re-enter `debug` instead.

inputs:
  task:
    description: "Kebab-case bug slug, also the OpenSpec change name."
    required: true

artifacts:
  diagnosis:
    path: "bugs/{task}/diagnosis.md"
    description: >-
      Output of `debug`: report, reproduction (and failing test path), proven
      root cause, blast radius, fix approach. Exists before the change does,
      hence outside the change root. `plan` folds it into the proposal, design,
      and repro.md.
  proposal:
    path: "<changeRoot>/proposal.md"
    description: "The bug, proven root cause and blast radius, and fix approach."
  specs_delta:
    path: "<changeRoot>/specs/<capability-path>/spec.md"
    description: >-
      Corrected behavior as MODIFIED/ADDED requirements, including a scenario
      for the bug's trigger that the regression test enforces. Skip only for a
      purely internal defect with no spec-level behavior change.
  design:
    path: "<changeRoot>/design.md"
    description: "How the fix addresses the root cause, and the regression-test strategy."
  tasks:
    path: "<changeRoot>/tasks.md"
    description: >-
      Ordered checkbox steps: capture the failing test, fix at the root cause,
      green the regression test.
  repro:
    path: "<changeRoot>/repro.md"
    description: >-
      Copy of the diagnosis's Reproduction (steps/inputs, failing test path),
      so it archives with the change and the gates can judge the fix against
      it. Refresh it after any `debug` re-entry that revises the reproduction.
  log:
    path: ".workflow/runs/bug-fix/{task}/workflow-log.md"
    description: >-
      Append-only state/transition log. Records entering and leaving `debug`
      and the child's terminal state; the child keeps `bugs/{task}/debug-log.md`.
      Available before change creation and after archive.

initial: debug

states:
  debug:
    invoke:
      workflow: debug
      inputs:
        require_openspec: true
    goal: >-
      Run the `debug` sub-workflow for `{task}` to get a proven root cause in
      `diagnosis.md`. On re-entry start at the transition's `entry`. No work of
      its own: no change is created and no code edited here.
    produces: [diagnosis]
    exit_gate: "The child ended in `done`: reliable reproduction, proven root cause, fix approach chosen."
    transitions:
      - when: "The child ended in `abort`."
        to: done
        reason: "debug aborted; nothing to plan - report the child's findings"
      - when: "exit_gate holds"
        to: plan
        reason: "root cause proven"

  plan:
    goal: >-
      Turn `diagnosis.md` into an OpenSpec change via `openspec-propose`:
      proposal (bug, root cause, fix approach), delta spec with a regression
      scenario for the trigger, design when the schema calls for it, and tasks.
      Then copy the reproduction into repro.md. After a
      `debug` re-entry, update the existing change via `openspec-update-change`
      instead of creating one. Planning only: no code.
    consumes: [diagnosis]
    produces: [proposal, specs_delta, design, tasks, repro]
    exit_gate: >-
      The apply-required artifacts are done/skipped; the proposal states the bug
      and proven root cause; the corrected behavior and a regression scenario
      are captured (or deliberately skipped per the schema); tasks.md traces to
      reproducing, fixing, and regression-guarding the bug; repro.md is recorded.
    transitions:
      - when: "Writing the change exposed that the diagnosis is wrong or incomplete."
        to: debug
        entry: diagnose
        reason: "refinement: planning invalidated the diagnosis"
      - when: "Writing the change exposed that the report/expectation itself is wrong or only one facet."
        to: debug
        entry: triage
        reason: "refinement: planning exposed a deeper reporting gap"
      - when: "exit_gate holds"
        to: fix
        reason: "fix change proposed with traceable artifacts"

  fix:
    goal: >-
      Implement the fix via `openspec-apply-change`, in task order, checking
      boxes off as they land. Keep it minimal and scoped to the root cause; no
      unrelated refactors. Turn the reproduction into a regression test (or
      confirm the failing test now passes) and keep the suite green. If the fix
      forces the diagnosis or plan to change, loop; do not patch around it or
      narrow the fix silently.
    consumes: [proposal, specs_delta, design, tasks, repro]
    produces: [tasks]
    exit_gate: >-
      All tracked tasks complete; the fix addresses the root cause; the
      reproduction no longer triggers the bug; a regression test covers it and
      passes. (Full-suite confirmation is in verify.)
    transitions:
      - when: >-
          The fix proved the diagnosis wrong or incomplete (it does not stop the
          reproduction, or revealed a different cause).
        to: debug
        entry: diagnose
        reason: "refinement: the fix invalidated the diagnosis"
      - when: "The change's plan/tasks or corrected-behavior specs are wrong or incomplete, but the diagnosis holds."
        to: plan_revision
        reason: "refinement: the fix invalidated the plan"
      - when: "The bug as reported is only one facet of a broader defect."
        to: debug
        entry: triage
        reason: "refinement: the fix exposed a deeper reporting gap"
      - when: "exit_gate holds"
        to: verify
        reason: "fix implemented, reproduction no longer triggers"

  plan_revision:
    goal: >-
      Reconcile the planning artifacts with what implementation or verification
      uncovered, via `openspec-update-change`: revise whichever of proposal,
      delta specs, design, tasks are wrong and keep them coherent. If the scope
      has become a different problem, surface it and ask about a fresh change.
    consumes: [proposal, specs_delta, design, tasks, repro]
    produces: [proposal, specs_delta, design, tasks]
    exit_gate: >-
      Affected artifacts are revised and coherent, the apply-required set is
      still done/skipped, and every task still traces to reproducing, fixing, or
      regression-guarding the bug.
    transitions:
      - when: "exit_gate holds"
        to: fix
        reason: "plan reconciled; resume the revised tasks"

  verify:
    goal: >-
      Prove the fix independently of writing it. Run the project's full
      verification suite (build, tests, lint, project checks) and `openspec
      validate`. Confirm the original trigger no longer produces the bug, the
      regression test guards it, and nothing regressed. Mechanical only: no
      re-planning.
    consumes: [proposal, repro]
    exit_gate: >-
      Suite and validation pass cleanly, the original scenario is demonstrably
      fixed, and the regression test fails without the fix and passes with it.
    transitions:
      - when: "A check errored, the original scenario still reproduces, or unrelated behavior regressed."
        to: fix
        reason: "verification failed"
      - when: "Validation flagged the artifacts (not the code) as malformed or inconsistent."
        to: plan_revision
        reason: "refinement: validation surfaced a planning gap"
      - when: "exit_gate holds"
        to: integration
        reason: "fix verified and regression guarded"

  integration:
    goal: >-
      Land the fix per the repository's conventions and archive the change
      (`openspec-archive-change`). The repro.md archives with it; record its archived path in the journal.
    consumes: [proposal, specs_delta, repro]
    exit_gate: >-
      Committed (and PR opened if that is the flow), docs/changelog updated if
      kept, no stray temporary artifacts, change synced and archived (or the
      user explicitly deferred it). Holds vacuously if the user opted out of
      integration.
    transitions:
      - when: "Landing surfaced a problem needing a code change."
        to: fix
        reason: "integration surfaced a defect; fix then re-verify"
      - when: "Sync or archive hit a blocking condition in the planning artifacts."
        to: plan_revision
        reason: "refinement: sync/archive surfaced a planning gap"
      - when: "exit_gate holds"
        to: done
        reason: "fix landed and change archived"

  done:
    terminal: true
    goal: >-
      Reproduced, root-caused, fixed, and verified with a regression test, as an
      archived OpenSpec change with delta specs synced. Also the end state when
      `debug` aborted: report why and stop.

herdr:
  suggested_panes:
    - role: verify
      lifecycle: persistent
      purpose: "Reproduction/regression test on a watcher for the fix and verify gates."
