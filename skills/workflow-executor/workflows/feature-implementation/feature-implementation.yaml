name: feature-implementation
version: 4
description: >-
  Drive a feature from orientation through integration, with OpenSpec as the
  system of record for planning and tasks: explore (optional) -> propose ->
  apply -> verify -> review -> archive. OpenSpec artifact work follows
  the matching OpenSpec skill; this workflow supplies the gates and refinement
  loops OpenSpec does not model. Mechanical verification gates entry to
  behavioral review, so the reviewer always reasons about confirmed-green code.

# OpenSpec conventions (skills, changeRoot, gates, resume) are in the executor
# skill. `{task}` is also the change name.

inputs:
  task:
    description: "Kebab-case feature slug, also the OpenSpec change name (e.g. add-user-pagination)."
    required: true

artifacts:
  proposal:
    path: "<changeRoot>/proposal.md"
    description: "What and why, with scope boundaries."
  specs_delta:
    path: "<changeRoot>/specs/<capability-path>/spec.md"
    description: "ADDED/MODIFIED/REMOVED/RENAMED requirements with testable scenarios. These are the acceptance criteria."
  design:
    path: "<changeRoot>/design.md"
    description: "How the change is built. Conditional: only when the schema calls for it."
  tasks:
    path: "<changeRoot>/tasks.md"
    description: "Ordered checkbox implementation steps; the unit of progress, so a handoff resumes at the first unchecked task."
  review:
    path: "<changeRoot>/review.md"
    description: "Behavioral review findings against the proposal, delta specs, and design."
  log:
    path: ".workflow/runs/feature-implementation/{task}/workflow-log.md"
    description: "Run journal, available before change creation and after archive."

initial: orientation

states:
  orientation:
    goal: >-
      Understand the problem in its real context before proposing anything, and
      run the OpenSpec project check. Read the affected code; confirm the
      feature (or part of it) does not already exist, checking existing
      OpenSpec capabilities (`openspec list --specs`, `openspec show`) as well
      as the code; capture constraints. Discover and record the project's real
      build, test, lint, and verification commands: later gates need them.
      Thinking state: `openspec-explore` is optional; write no code and do not
      create the change. Record findings and commands in the run journal.
    subagent: scout
    exit_gate: >-
      OpenSpec has a usable root (or the user chose how to proceed); affected
      components and existing/overlapping behavior (code and specs) are
      identified; the verification commands are recorded; constraints and open
      questions are captured.
    transitions:
      - outcome: oriented
        when: "exit_gate holds"
        to: specification
        reason: "enough context to propose a change"

  specification:
    goal: >-
      Turn the orientation findings into a complete change via
      `openspec-propose`: proposal, delta specs with testable scenarios, design
      when the schema calls for it, and tasks. Feed the recorded verification
      commands and constraints into the artifacts. Record open questions and
      resolve material ones with the user. Planning only: no implementation.
    subagent: planner
    produces: [proposal, specs_delta, design, tasks]
    exit_gate: >-
      The apply-required artifacts are done/skipped; the delta spec states
      testable acceptance criteria; scope boundaries are explicit; tasks.md has
      ordered steps tracing to those criteria; no material open questions remain.
    transitions:
      - outcome: context_gap_found
        when: "Proposing exposed an orientation gap that needs investigating in the code or specs."
        to: orientation
        reason: "refinement: proposal surfaced a context gap"
        max_retries: 2
      - outcome: specified
        when: "exit_gate holds"
        to: implementation
        reason: "change proposed with traceable planning artifacts"

  implementation:
    invoke:
      workflow: task-implementation
    goal: >-
      Execute implementation of the planned tasks via the task-implementation
      sub-workflow. The child workflow's worker runs quality intake, implements
      tasks in order, verifies code checks, and records implementation evidence.
      If the child reports a blocked condition (infeasible, under-specified, or
      unresolvable checks), hand off to planning_revision.
    consumes: [proposal, specs_delta, design, tasks]
    produces: [tasks]
    exit_gate: "The child ended in `done`: all tasks implemented and verified with evidence."
    transitions:
      - outcome: implementation_blocked
        when: "The child ended in `blocked`: task infeasible, under-specified, or verification failed."
        to: planning_revision
        reason: "refinement: task implementation blocked; revise plan or specs"
        max_retries: 2
      - outcome: implemented
        when: "exit_gate holds"
        to: verification
        reason: "all tasks implemented with checks"

  planning_revision:
    goal: >-
      Reconcile the planning artifacts with what implementation or review
      uncovered, via `openspec-update-change`, for both a shallow plan fix and a
      deeper requirement fix. Revise whichever of proposal, delta specs, design,
      tasks are wrong and keep them coherent. If the intent has changed rather
      than been refined, surface it and ask about a fresh change.
    subagent: planner
    consumes: [proposal, specs_delta, design, tasks, review]
    produces: [proposal, specs_delta, design, tasks]
    exit_gate: >-
      Affected artifacts are revised and coherent, the apply-required set is
      still done/skipped, every task traces to an acceptance criterion, and
      every criterion is covered by at least one task.
    transitions:
      - outcome: plan_reconciled
        when: "exit_gate holds"
        to: implementation
        reason: "plan reconciled; resume the revised tasks"

  verification:
    goal: >-
      Run the full mechanical verification suite with the commands recorded in
      orientation (build, tests, lint, project checks) and `openspec validate`.
      Mechanical only: no behavioral judgment.
    exit_gate: "The full suite and `openspec validate` run and pass with no errors or warnings."
    transitions:
      - outcome: verification_failed
        when: "A check errored, failed, or could not be run."
        to: implementation
        reason: "verification failed"
        max_retries: 2
      - outcome: verified
        when: "exit_gate holds"
        to: review
        reason: "suite green; safe to review behavior"

  review:
    goal: >-
      Review the diff behaviorally against the change: does it do what the delta
      specs' scenarios require, are edge cases handled, is it coherent with the
      proposal and design? The code is already green, so focus on behavior and
      design. Record actionable findings in review.md.
    subagent: reviewer
    consumes: [proposal, specs_delta, design]
    produces: [review]
    exit_gate: >-
      No blocking defects remain (or all were resolved), and every acceptance
      criterion in the delta specs is demonstrably met by the running software.
    transitions:
      - outcome: review_defects_found
        when: "Defects must be fixed in the implementation."
        to: implementation
        reason: "review found defects; fix then re-verify"
        max_retries: 2
      - outcome: review_spec_gap
        when: "The proposal, delta specs, or design themselves are wrong or incomplete."
        to: planning_revision
        reason: "refinement: review surfaced a spec/plan gap"
        max_retries: 2
      - outcome: review_passed
        when: "exit_gate holds"
        to: integration
        reason: "review passed and criteria met"

  integration:
    goal: >-
      Land the work per the repository's conventions and archive the change
      (`openspec-archive-change`). The review.md archives with it; record its archived path in the journal.
    consumes: [proposal, specs_delta]
    exit_gate: >-
      Committed (and PR opened if that is the flow), docs/changelog updated if
      kept, no stray temporary artifacts, change synced and archived (or the
      user explicitly deferred it). Holds vacuously if the user opted out of
      integration.
    transitions:
      - outcome: integration_defect
        when: "Landing surfaced a problem needing a code change."
        to: implementation
        reason: "integration surfaced a defect; fix then re-verify"
        max_retries: 2
      - outcome: sync_gap
        when: "Sync or archive hit a blocking condition in the planning artifacts."
        to: planning_revision
        reason: "refinement: sync/archive surfaced a planning gap"
        max_retries: 2
      - outcome: integrated
        when: "exit_gate holds"
        to: done
        reason: "work landed and change archived"
        requires_approval: true

  done:
    terminal: true
    goal: >-
      Oriented, proposed, implemented, verified, reviewed, and integrated, with
      delta specs synced and the change archived.

herdr:
  suggested_panes:
    - role: verify
      lifecycle: persistent
      purpose: "Live build/test status for the implementation and verification gates."
    - role: review
      lifecycle: on-enter-review
      purpose: "Hosts a reviewer agent during the review state."
