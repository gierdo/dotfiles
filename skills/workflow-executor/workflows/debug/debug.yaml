name: debug
version: 2
description: >-
  Take a bug report to a proven root cause, and stop there. Triage, reproduce,
  and diagnose, ending in a written diagnosis (report, reproduction, root cause,
  blast radius, fix approach). Never fixes anything. Runs standalone or as a
  sub-workflow of bug-fix. On re-entry from a parent (`entry` plus a reason),
  read the existing diagnosis and log, treat the reason as new evidence, and
  revise the diagnosis in place instead of starting over.

# Read-only with respect to product code. Reproduction tests and diagnostic
# instrumentation are allowed; remove the instrumentation before leaving
# (keep the failing reproduction test and record it).

inputs:
  task:
    description: "Kebab-case bug slug (e.g. login-500-on-empty-email)."
    required: true
  require_openspec:
    description: >-
      When true, triage confirms OpenSpec is usable (non-null root) because the
      caller will create a change later. Otherwise OpenSpec specs are consulted
      only if the project has them.
    required: false

artifacts:
  diagnosis:
    path: "bugs/{task}/diagnosis.md"
    description: >-
      The durable output. Sections: Report (observed vs expected, environment,
      exact trigger), Reproduction (smallest reliable steps/inputs, path of the
      failing test), Root cause (with proving evidence), Blast radius, Fix
      approach (addresses the cause, not the symptom), Revision history (one
      line per re-entry: what was invalidated and why). Lives outside any
      OpenSpec change because the change may not exist yet.
  log:
    path: "bugs/{task}/debug-log.md"
    description: "Append-only state/transition log."

initial: triage

states:
  triage:
    goal: >-
      Capture the bug precisely: observed vs expected behavior, environment,
      exact trigger. Resolve ambiguity with the user rather than guessing.
      Confirm it is a genuine defect (a gap between intended and actual
      behavior), checking docs and existing specs as well as code. If
      `require_openspec`, run the OpenSpec project check first. Thinking state:
      write no code. Start `diagnosis.md` with the Report section.
    produces: [diagnosis]
    exit_gate: >-
      Observed and expected behavior are stated, the trigger is concrete enough
      to attempt reproduction, it is confirmed a genuine defect, and (if
      `require_openspec`) OpenSpec has a usable root or the user has chosen how
      to proceed.
    transitions:
      - outcome: not_a_defect
        when: "The reported behavior is intended, or the user declines to pursue it."
        to: abort
        reason: "not a defect, or declined"
      - outcome: triaged
        when: "exit_gate holds"
        to: reproduce
        reason: "captured clearly enough to reproduce"

  reproduce:
    goal: >-
      Make the bug happen on demand. Reduce it to the smallest reliable
      reproduction and, where the project allows, capture it as a failing
      automated test. Do not attempt a fix. Record the reproduction in
      `diagnosis.md`.
    consumes: [diagnosis]
    produces: [diagnosis]
    exit_gate: >-
      The bug reproduces reliably from the recorded steps (ideally via a test
      failing for the reported reason), with no flakiness that would mask
      whether a later fix worked.
    transitions:
      - outcome: report_contradicted
        when: >-
          Reproduction showed the report is wrong, incomplete, or describes
          expected behavior.
        to: triage
        reason: "refinement: reproduction contradicted the report"
        max_retries: 2
      - outcome: cannot_reproduce
        when: >-
          It cannot be reproduced after sustained, varied effort, and the user
          has been told what was tried and what is missing.
        to: abort
        reason: "cannot reproduce"
      - outcome: reproduced
        when: "exit_gate holds"
        to: diagnose
        reason: "reproduces reliably"

  diagnose:
    goal: >-
      Find the true root cause, not a symptom. Trace from the reproduction to the
      responsible code or behavior and gather evidence that proves it (e.g. the
      failure disappears when the cause is neutralized and returns when
      restored). Record root cause, evidence, blast radius, and fix approach in
      `diagnosis.md`. Do not fix; instrumentation is fine but must be removed
      before leaving. `openspec-explore` may help. On re-entry, add a Revision
      history line.
    consumes: [diagnosis]
    produces: [diagnosis]
    exit_gate: >-
      The root cause is identified with evidence (not a hypothesis), the blast
      radius is understood, a fix approach addressing the cause is chosen, all
      are written in `diagnosis.md`, and no instrumentation remains in the tree.
    transitions:
      - outcome: sharper_repro_needed
        when: >-
          Diagnosis needs a better reproduction to isolate the cause (too broad,
          flaky, or not exercising the suspected path).
        to: reproduce
        reason: "refinement: needs a sharper reproduction"
        max_retries: 2
      - outcome: report_gap_found
        when: "The report or expected behavior itself is wrong or only one facet of a broader defect."
        to: triage
        reason: "refinement: deeper reporting gap"
        max_retries: 2
      - outcome: diagnosed
        when: "exit_gate holds"
        to: done
        reason: "root cause proven, fix approach chosen"

  abort:
    terminal: true
    goal: >-
      Ended without a proven root cause (not a defect, declined, or not
      reproducible). Record why, what was tried, and what would unblock it in
      `diagnosis.md`, and tell the user. A parent must not plan a fix.

  done:
    terminal: true
    goal: "Reproducible, root-caused, fix approach chosen, all in `diagnosis.md`. No fix made."

herdr:
  suggested_panes:
    - role: repro
      lifecycle: persistent
      purpose: "Reproduction test on a watcher for live red/green."
    - role: diagnose
      lifecycle: on-enter-diagnose
      purpose: "Instrumentation, debugger, or log tails."
